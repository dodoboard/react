[project]
name = "influencer-studio"
version = "0.1.0"
description = "Local AI influencer studio on FLUX.2 + ComfyUI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=14",
    "pillow>=10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
